<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
  <body style="margin:0;background:#f7f7f8;color:#18181b;font-family:Arial,Helvetica,sans-serif;padding:32px 16px">
    <table role="presentation" style="width:100%;max-width:480px;margin:0 auto;background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:32px">
      <tr><td>
        <p style="margin:0 0 28px;font-size:18px;font-weight:700">sitegen</p>
        <h1 style="margin:0 0 16px;font-size:24px">Reset your password</h1>
        <p style="font-size:15px;line-height:1.6;color:#52525b">Enter this six-digit code on the password reset page, or use the button to continue securely:</p>
        <p style="margin:28px 0 18px;padding:20px;background:#f4f4f5;border-radius:8px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
        <p style="margin:0 0 24px;text-align:center"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 18px;border-radius:8px;background:#18181b;color:#fff;text-decoration:none;font-size:14px;font-weight:700">Reset password</a></p>
        <p style="font-size:14px;line-height:1.6;color:#52525b">This code expires in 10 minutes. If you did not request a password reset, you can ignore this email.</p>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#71717a">Need help? <a href="mailto:admin@gensite.tech" style="color:#52525b">admin@gensite.tech</a></p>
      </td></tr>
    </table>
  </body>
</html>
