<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;background:#f7f7f8;color:#18181b;font-family:Arial,Helvetica,sans-serif;padding:32px 16px">
    <table role="presentation" style="width:100%;max-width:480px;margin:0 auto;background:#fff;border:1px solid #e4e4e7;border-radius:16px;padding:32px">
      <tr><td>
        <p style="margin:0 0 28px;font-size:18px;font-weight:700">sitegen</p>
        <h1 style="margin:0 0 16px;font-size:24px">Verify your email</h1>
        <p style="font-size:15px;line-height:1.6;color:#52525b">Enter this code on the create account page to verify your email address:</p>
        <p style="margin:28px 0;padding:20px;background:#f4f4f5;border-radius:8px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
        <p style="font-size:14px;line-height:1.6;color:#52525b">This code expires in 10 minutes. Keep it private.</p>
        <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#71717a">If you did not request a sitegen account, you can ignore this email.</p>
        <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#71717a">Need help? <a href="mailto:admin@gensite.tech" style="color:#52525b">admin@gensite.tech</a></p>
      </td></tr>
    </table>
  </body>
</html>
